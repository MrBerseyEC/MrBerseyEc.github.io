<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Half &amp; Full Adder Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: tabs → live gate circuit → truth table + binary sum side by side */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#d5dcd9;
  --on:#178a55; --off:#a9b5b0; --accent:#1f6fb2; --hi:#e7f4ec;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --fg:#e4ece9; --muted:#93a39d; --line:#2c3833;
  --on:#4fd18f; --off:#4c5c56; --accent:#5eaaf0; --hi:#1d3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --fg:#e4ece9; --muted:#93a39d; --line:#2c3833;
  --on:#4fd18f; --off:#4c5c56; --accent:#5eaaf0; --hi:#1d3329; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:65ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px var(--mono);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs button[aria-selected="true"]{background:var(--hi);border-color:var(--on)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.circuit{overflow-x:auto}
.circuit svg{display:block;width:100%;min-width:560px;height:auto}
svg text{font-family:var(--mono);fill:var(--fg)}
.w{fill:none;stroke-width:3;stroke:var(--off);stroke-linejoin:round;transition:stroke .15s}
.w.on{stroke:var(--on)}
.gate{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.gl{font-size:11px;fill:var(--muted)}
.dot{fill:var(--off)} .dot.on{fill:var(--on)}
.sw{cursor:pointer}
.sw rect{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.sw.on rect{fill:var(--on);stroke:var(--on)}
.sw text{font-size:15px;font-weight:600}
.sw.on text.v{fill:var(--panel)}
.sw:focus-visible rect{stroke:var(--accent);stroke-width:3}
.led{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.led.on{fill:var(--on);stroke:var(--on)}
.lab{font-size:14px;font-weight:600}
.mid{font-size:11px;fill:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.bottom{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:680px){.bottom{grid-template-columns:1fr}}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums}
th,td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
th.out,td.out{border-left:2px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tbody tr.cur{background:var(--hi);font-weight:600}
.sum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;line-height:1.7}
.sum .r{color:var(--on);font-weight:600}
.expr{font-family:var(--mono);font-size:14px;margin:14px 0 0;display:flex;flex-direction:column;gap:4px}
.expr span{color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>Half and full adders</h1>
    <p class="sub">Click the input switches or a truth-table row. Green wires carry 1, grey wires carry 0.</p>
  </header>

  <div class="tabs" role="tablist">
    <button id="tabH" role="tab" aria-selected="true">Half adder</button>
    <button id="tabF" role="tab" aria-selected="false">Full adder</button>
  </div>

  <div class="panel circuit"><svg id="svg"></svg><p class="hint">Keys: <b>A</b>, <b>B</b>, <b>C</b> toggle inputs. A dot marks a junction; wires that cross without a dot are not connected.</p></div>

  <div class="bottom">
    <div class="panel"><h2>Truth table</h2><table id="tt"></table></div>
    <div class="panel">
      <h2>As binary addition</h2>
      <div class="sum" id="sum"></div>
      <div class="expr" id="expr"></div>
    </div>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const OFF = { AND: 0, OR: 7, XOR: 15 };
const orPath = (x, y, w) => `M${x} ${y} Q${x+18} ${y+20} ${x} ${y+40} Q${x+w*0.7} ${y+40} ${x+w} ${y+20} Q${x+w*0.7} ${y} ${x} ${y} Z`;
const shape = g => g.t === 'AND' ? `M${g.x} ${g.y} h40 a20 20 0 0 1 0 40 h-40 Z`
  : g.t === 'OR' ? orPath(g.x, g.y, 60)
  : orPath(g.x + 8, g.y, 52) + ` M${g.x} ${g.y} Q${g.x+18} ${g.y+20} ${g.x} ${g.y+40}`;
const gin = (g, i) => [g.x + OFF[g.t], g.y + 10 + 20 * i];
const gout = g => [g.x + 60, g.y + 20];

const CIRCUITS = {
  half: {
    view: '0 0 560 250', inputs: ['A', 'B'],
    pos: { A: [40, 70], B: [40, 170] },
    gates: { x1: { t: 'XOR', x: 240, y: 50 }, a1: { t: 'AND', x: 240, y: 150 } },
    eval: s => ({ ...s, x1: s.A ^ s.B, a1: s.A & s.B, Sum: s.A ^ s.B, Carry: s.A & s.B }),
    outputs: { Sum: ['x1', 470, 70], Carry: ['a1', 470, 170] },
    wires: g => [
      ['A', [[64,70],[130,70]]], ['A', [[130,70],[130,60],gin(g.x1,0)]], ['A', [[130,70],[130,160],gin(g.a1,0)]],
      ['B', [[64,170],[170,170]]], ['B', [[170,170],[170,80],gin(g.x1,1)]], ['B', [[170,170],[170,180],gin(g.a1,1)]],
    ],
    dots: [['A',130,70],['B',170,170]],
    mids: [],
    table: ['A','B','|','Carry','Sum'],
    expr: ['Sum = A ⊕ B', 'Carry = A · B'],
  },
  full: {
    view: '0 0 760 340', inputs: ['A', 'B', 'Cin'],
    pos: { A: [40, 60], B: [40, 140], Cin: [40, 270] },
    gates: {
      x1: { t: 'XOR', x: 200, y: 70 }, a1: { t: 'AND', x: 200, y: 160 },
      x2: { t: 'XOR', x: 420, y: 90 }, a2: { t: 'AND', x: 420, y: 190 },
      o1: { t: 'OR', x: 580, y: 200 },
    },
    eval: s => { const x1 = s.A ^ s.B, a1 = s.A & s.B, a2 = x1 & s.Cin;
      return { ...s, x1, a1, a2, x2: x1 ^ s.Cin, o1: a1 | a2, Sum: x1 ^ s.Cin, Cout: a1 | a2 }; },
    outputs: { Sum: ['x2', 690, 110], Cout: ['o1', 690, 220] },
    wires: g => [
      ['A', [[64,60],[130,60]]], ['A', [[130,60],[130,80],gin(g.x1,0)]], ['A', [[130,60],[130,170],gin(g.a1,0)]],
      ['B', [[64,140],[160,140]]], ['B', [[160,140],[160,100],gin(g.x1,1)]], ['B', [[160,140],[160,190],gin(g.a1,1)]],
      ['Cin', [[64,270],[380,270]]], ['Cin', [[380,270],[380,120],gin(g.x2,1)]], ['Cin', [[380,270],[380,220],gin(g.a2,1)]],
      ['x1', [gout(g.x1),[340,90]]], ['x1', [[340,90],[340,100],gin(g.x2,0)]], ['x1', [[340,90],[340,200],gin(g.a2,0)]],
      ['a1', [gout(g.a1),[310,180],[310,310],[550,310],[550,230],gin(g.o1,1)]],
      ['a2', [gout(g.a2),[530,210],[530,210],gin(g.o1,0)]],
    ],
    dots: [['A',130,60],['B',160,140],['Cin',380,270],['x1',340,90]],
    mids: [['x1', 290, 82, 'A⊕B'], ['a1', 270, 172, 'A·B'], ['a2', 492, 202, 'X·Cin']],
    table: ['A','B','Cin','|','Cout','Sum'],
    expr: ['X = A ⊕ B', 'Sum = A ⊕ B ⊕ Cin', 'Cout = A·B + Cin·(A ⊕ B)'],
  },
};

let mode = 'half';
let state = { A: 0, B: 0, Cin: 0 };

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}

function build() {
  const c = CIRCUITS[mode], svg = $('svg');
  svg.innerHTML = ''; svg.setAttribute('viewBox', c.view);
  svg.setAttribute('aria-label', (mode === 'half' ? 'Half' : 'Full') + ' adder circuit');
  const g = c.gates;
  const outWires = Object.entries(c.outputs).map(([name, [src, x, y]]) => [src, [gout(g[src]), [x - 14, gout(g[src])[1]], [x - 14, y], [x - 12, y]]]);
  [...c.wires(g), ...outWires].forEach(([sig, pts]) =>
    el('polyline', { class: 'w', 'data-s': sig, points: pts.map(p => p.join(',')).join(' ') }, svg));
  c.dots.forEach(([sig, x, y]) => el('circle', { class: 'dot', 'data-s': sig, cx: x, cy: y, r: 5 }, svg));
  for (const k in g) {
    el('path', { class: 'gate', d: shape(g[k]) }, svg);
    el('text', { class: 'gl', x: g[k].x + 30, y: g[k].y + 56, 'text-anchor': 'middle' }, svg, g[k].t);
  }
  c.mids.forEach(([sig, x, y, label]) => el('text', { class: 'mid', 'data-m': sig, x, y }, svg, label));
  c.inputs.forEach(name => {
    const [x, y] = c.pos[name];
    const sw = el('g', { class: 'sw', 'data-i': name, tabindex: 0, role: 'button', 'aria-label': 'Toggle ' + name }, svg);
    el('rect', { x: x - 24, y: y - 18, width: 48, height: 36, rx: 6 }, sw);
    el('text', { class: 'v', x, y: y + 5, 'text-anchor': 'middle' }, sw, '0');
    el('text', { class: 'lab', x: x - 30, y: y + 5, 'text-anchor': 'end' }, svg, name);
    sw.onclick = () => toggle(name);
    sw.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(name); } };
  });
  for (const name in c.outputs) {
    const [, x, y] = c.outputs[name];
    el('circle', { class: 'led', 'data-o': name, cx: x + 6, cy: y, r: 16 }, svg);
    el('text', { class: 'lab', x: x + 30, y: y + 5 }, svg, name);
    el('text', { class: 'lab', 'data-ov': name, x: x + 6, y: y + 5, 'text-anchor': 'middle' }, svg, '0');
  }
  buildTable(); $('expr').innerHTML = c.expr.map(e => `<div>${e}</div>`).join('');
  render();
}

function buildTable() {
  const c = CIRCUITS[mode], cols = c.table, n = c.inputs.length;
  let h = '<thead><tr>' + cols.filter(x => x !== '|').map((x, i) => `<th class="${i === n ? 'out' : ''}">${x}</th>`).join('') + '</tr></thead><tbody>';
  for (let r = 0; r < (1 << n); r++) {
    const s = {}; c.inputs.forEach((name, i) => s[name] = (r >> (n - 1 - i)) & 1);
    const v = c.eval({ Cin: 0, ...s });
    h += `<tr data-r="${r}">` + cols.filter(x => x !== '|').map((x, i) => `<td class="${i === n ? 'out' : ''}">${v[x]}</td>`).join('') + '</tr>';
  }
  $('tt').innerHTML = h + '</tbody>';
  $('tt').querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => {
    const r = +tr.dataset.r; c.inputs.forEach((name, i) => state[name] = (r >> (n - 1 - i)) & 1); render();
  });
}

function toggle(name) { if (CIRCUITS[mode].inputs.includes(name)) { state[name] ^= 1; render(); } }

function render() {
  const c = CIRCUITS[mode], s = c.eval(mode === 'half' ? { ...state, Cin: 0 } : state), svg = $('svg');
  svg.querySelectorAll('[data-s]').forEach(w => w.classList.toggle('on', !!s[w.dataset.s]));
  svg.querySelectorAll('[data-i]').forEach(sw => { const v = s[sw.dataset.i]; sw.classList.toggle('on', !!v); sw.querySelector('.v').textContent = v; sw.setAttribute('aria-pressed', !!v); });
  svg.querySelectorAll('[data-o]').forEach(l => l.classList.toggle('on', !!s[l.dataset.o]));
  svg.querySelectorAll('[data-ov]').forEach(t => t.textContent = s[t.dataset.ov]);
  const n = c.inputs.length; let r = 0; c.inputs.forEach((name, i) => r |= s[name] << (n - 1 - i));
  $('tt').querySelectorAll('tbody tr').forEach(tr => tr.classList.toggle('cur', +tr.dataset.r === r));
  const carry = mode === 'half' ? s.Carry : s.Cout, total = carry * 2 + s.Sum;
  const lhs = mode === 'half' ? `${s.A} + ${s.B}` : `${s.A} + ${s.B} + ${s.Cin}`;
  $('sum').innerHTML = `${lhs} = <span class="r">${carry}${s.Sum}</span><sub>2</sub> = ${total}<sub>10</sub>`;
}

function setMode(m) {
  mode = m;
  $('tabH').setAttribute('aria-selected', m === 'half'); $('tabF').setAttribute('aria-selected', m === 'full');
  build();
}
$('tabH').onclick = () => setMode('half');
$('tabF').onclick = () => setMode('full');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'a') toggle('A'); else if (k === 'b') toggle('B'); else if (k === 'c') toggle('Cin');
});
build();
</script>

</body></html>
