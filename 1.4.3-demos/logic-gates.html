<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic gates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--grid:rgba(22,32,43,.05);--panel:#F8FAFB;--ink:#16202B;--muted:#5B6874;--line:#C9D1D8;--one:#1F5BFF;--one-soft:#DDE6FF;--hl:#FFB000;--hl-soft:#FFF0C7;--off:#AEB8C1;--ok:#138A52;--bad:#C2362B}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--grid:rgba(255,255,255,.035);--panel:#1A222C;--ink:#E7EDF2;--muted:#9AA7B3;--line:#2E3A46;--one:#5B8CFF;--one-soft:#1E2E57;--hl-soft:#3D3110;--off:#4A5764;--ok:#3CC47F;--bad:#FF6B5E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:18px 0 8px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 18px}
.series{display:flex;gap:6px;flex-wrap:wrap}
.series a{font-size:.85rem;text-decoration:none;color:var(--muted);padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.series a[aria-current]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.toolbar{display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--panel);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-checked=true]{background:var(--ink);color:var(--bg)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--one)}
.expr,.tt,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.ob{display:inline-block;border-top:.08em solid currentColor;padding-top:.06em;line-height:1.1;margin:0 .03em}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
table.tt{border-collapse:collapse;font-size:.95rem}
.tt th,.tt td{padding:5px 14px;text-align:center;border-bottom:1px solid var(--line)}
.tt th{font-weight:600;color:var(--muted);border-bottom:2px solid var(--ink)}
.tt tr.cur td{background:var(--hl-soft)}
.tt td.one{color:var(--one);font-weight:700}
.tt td.hid{color:var(--muted);cursor:pointer;text-decoration:underline dotted}
button.bit{font:600 1rem 'JetBrains Mono',monospace;min-width:72px;padding:8px 10px;border-radius:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
button.bit[aria-pressed=true]{background:var(--one);border-color:var(--one);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;margin-top:26px}
.gate{background:var(--panel);border:1.5px solid var(--line);border-top:5px solid var(--ink);border-radius:6px 6px 14px 14px;padding:18px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 26px;align-items:start}
.gate h2{margin:0;font:700 1.9rem/1 'JetBrains Mono',monospace;letter-spacing:-.02em}
.gate .expr{font-size:1.15rem;margin:6px 0 2px}
.gate .desc{color:var(--muted);margin:0 0 4px}
.gate svg{width:100%;max-width:380px;display:block;margin:4px 0 6px}
.shape{fill:var(--panel);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.curve{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.w{stroke:var(--off);stroke-width:5;stroke-linecap:round;fill:none;transition:stroke .15s}
.w.on{stroke:var(--one)}
.w.unknown{stroke-dasharray:3 9}
.term{fill:var(--off);transition:fill .15s}.term.on{fill:var(--one)}
svg text{font:700 15px 'JetBrains Mono',monospace;fill:var(--ink)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gives{color:var(--muted);font-size:.9rem;margin:0 2px}
.lamp{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 1.25rem 'JetBrains Mono',monospace;background:var(--panel);color:var(--ink);transition:background .15s,box-shadow .15s;cursor:default}
.lamp.on{background:var(--one);border-color:var(--one);color:#fff;box-shadow:0 0 0 6px var(--one-soft),0 0 26px var(--one)}
.lamp.ask{border-style:dashed;cursor:pointer}
.ttcol{padding-top:4px}
.ttcol .cap{font-size:.85rem;color:var(--muted);margin:0 0 6px}
@media (max-width:600px){.gate{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Logic gates</h1>
  <p class="lede">Click an input to switch it between 0 and 1. A wire turns blue when it carries a 1, and the matching row of the truth table lights up.</p>
  <div class="toolbar">
    <span>Notation</span>
    <div class="seg" role="radiogroup" aria-label="Notation" id="nota">
      <button role="radio" data-n="ocr">¬ ∧ ∨ ⊻</button>
      <button role="radio" data-n="words">NOT AND OR XOR</button>
      <button role="radio" data-n="alg">Algebra</button>
    </div>
    <label class="check"><input type="checkbox" id="predict"> Hide outputs so the class can predict</label>
  </div>
  <main class="gates" id="gates"></main>
</div>
<script>
/* ---------- shared logic helpers (same in all three demos) ---------- */
const SYM={ocr:{and:' ∧ ',or:' ∨ ',xor:' ⊻ ',not:'¬'},alg:{and:'·',or:' + ',xor:' ⊕ ',not:''},words:{and:' AND ',or:' OR ',xor:' XOR ',not:'NOT '}};
let NOTA='ocr';
function parse(src){
  const s=src.toUpperCase().replace(/\bAND\b/g,'&').replace(/\bXOR\b/g,'^').replace(/\bOR\b/g,'|').replace(/\bNOT\b/g,'!');
  const t=[];
  for(const ch of s){
    if(/\s/.test(ch))continue;
    if('&·.∧*'.includes(ch))t.push('&');else if('|+∨'.includes(ch))t.push('|');
    else if('^⊕⊻'.includes(ch))t.push('^');else if('!¬~'.includes(ch))t.push('!');
    else if("'’".includes(ch))t.push("'");else if('()01ABCD'.includes(ch))t.push(ch);
    else throw new Error(`Unexpected character “${ch}”. Use A–D, 0, 1, brackets and operators.`);
  }
  if(!t.length)throw new Error('Type an expression first.');
  let i=0;const pk=()=>t[i];
  const orE=()=>{let n=xorE();while(pk()==='|'){i++;n={t:'or',a:n,b:xorE()}}return n};
  const xorE=()=>{let n=andE();while(pk()==='^'){i++;n={t:'xor',a:n,b:andE()}}return n};
  const andE=()=>{let n=un();while(pk()==='&'||(pk()&&'!(01ABCD'.includes(pk()))){if(pk()==='&')i++;n={t:'and',a:n,b:un()}}return n};
  const un=()=>{if(pk()==='!'){i++;return{t:'not',a:un()}}let n=atom();while(pk()==="'"){i++;n={t:'not',a:n}}return n};
  const atom=()=>{const c=t[i++];
    if(c===undefined)throw new Error('The expression ends too early.');
    if(c==='('){const n=orE();if(t[i]!==')')throw new Error('A closing bracket is missing.');i++;return{t:'grp',a:n}}
    if(c==='0'||c==='1')return{t:'const',v:+c};
    if('ABCD'.includes(c))return{t:'var',n:c};
    throw new Error(`“${c}” is in the wrong place.`)};
  const tree=orE();if(i<t.length)throw new Error(`“${t[i]}” is in the wrong place.`);return tree;
}
function ev(n,e){switch(n.t){case'var':return e[n.n];case'const':return n.v;case'grp':return ev(n.a,e);case'not':return 1-ev(n.a,e);case'and':return ev(n.a,e)&ev(n.b,e);case'or':return ev(n.a,e)|ev(n.b,e);case'xor':return ev(n.a,e)^ev(n.b,e)}}
function varsOf(n,s=new Set()){if(n.t==='var')s.add(n.n);if(n.a)varsOf(n.a,s);if(n.b)varsOf(n.b,s);return[...s].sort()}
const PREC={or:1,xor:2,and:3,not:4,var:5,const:5,grp:5};
function show(n,nota=NOTA,parent=0){
  const S=SYM[nota];let out;
  switch(n.t){
    case'var':return n.n;case'const':return String(n.v);
    case'grp':return'('+show(n.a,nota,0)+')';
    case'not':if(nota==='alg')return`<span class="ob">${show(n.a.t==='grp'?n.a.a:n.a,nota,0)}</span>`;out=S.not+show(n.a,nota,4);break;
    default:out=show(n.a,nota,PREC[n.t])+S[n.t]+show(n.b,nota,PREC[n.t]);
  }
  return PREC[n.t]<parent?'('+out+')':out;
}
function envFor(row,vars){const e={};vars.forEach((v,k)=>e[v]=(row>>(vars.length-1-k))&1);return e}
function bindNotation(rerender){
  const seg=document.getElementById('nota');
  const sync=()=>seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',b.dataset.n===NOTA));
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;NOTA=b.dataset.n;sync();rerender()});
  sync();
}

/* ---------- gates ---------- */
const GATES=[
  {id:'and',name:'AND',vars:['A','B'],src:'A&B',desc:'Output is 1 only when both inputs are 1.'},
  {id:'or',name:'OR',vars:['A','B'],src:'A|B',desc:'Output is 1 when at least one input is 1.'},
  {id:'not',name:'NOT',vars:['A'],src:'!A',desc:'Output is the opposite of the input. It has only one input.'},
  {id:'xor',name:'XOR',vars:['A','B'],src:'A^B',desc:'Output is 1 when the two inputs are different.'}
];
const SHAPES={
  and:{inX:60,outX:125,d:'M60 20 H95 A30 30 0 0 1 95 80 H60 Z'},
  or:{inX:62.5,outX:130,d:'M55 20 Q75 50 55 80 Q100 80 130 50 Q100 20 55 20 Z'},
  xor:{inX:54.5,outX:138,d:'M63 20 Q83 50 63 80 Q108 80 138 50 Q108 20 63 20 Z',extra:'M47 20 Q67 50 47 80'},
  not:{inX:65,outX:132,d:'M65 20 L120 50 L65 80 Z',bubble:true}
};
let predict=false;

function svgFor(g){
  const s=SHAPES[g.id],ys=g.vars.length===2?[35,65]:[50];
  const ins=g.vars.map((v,k)=>`<text x="0" y="${ys[k]+5}">${v}</text><path class="w" data-w="${v}" d="M20 ${ys[k]} H${s.inX}"/><circle class="term" data-t="${v}" cx="20" cy="${ys[k]}" r="6"/>`).join('');
  return `<svg viewBox="0 0 222 100" role="img" aria-label="${g.name} gate symbol">${ins}
    <path class="w" data-w="Q" d="M${s.outX} 50 H198"/>
    <path class="shape" d="${s.d}"/>${s.extra?`<path class="curve" d="${s.extra}"/>`:''}${s.bubble?'<circle class="shape" cx="126" cy="50" r="6"/>':''}
    <text x="206" y="55">Q</text></svg>`;
}

function build(g){
  g.tree=parse(g.src);g.st={A:0,B:0};g.seen=new Set();
  const el=document.createElement('section');el.className='gate';el.id=g.id;g.el=el;
  const rows=[...Array(1<<g.vars.length).keys()];
  el.innerHTML=`<div>
      <h2>${g.name}</h2>
      <p class="expr" data-expr></p>
      <p class="desc">${g.desc}</p>
      ${svgFor(g)}
      <div class="controls">
        ${g.vars.map(v=>`<button class="bit" data-in="${v}" aria-pressed="false"></button>`).join('')}
        <span class="gives">gives</span>
        <button class="lamp" data-lamp aria-live="polite"></button>
      </div>
    </div>
    <div class="ttcol">
      <p class="cap">Truth table</p>
      <table class="tt"><thead><tr>${g.vars.map(v=>`<th>${v}</th>`).join('')}<th>Q</th></tr></thead>
      <tbody>${rows.map(r=>{const e=envFor(r,g.vars);return`<tr data-r="${r}">${g.vars.map(v=>`<td>${e[v]}</td>`).join('')}<td data-out="${r}"></td></tr>`}).join('')}</tbody></table>
    </div>`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-in]');
    if(b){g.st[b.dataset.in]^=1;return update(g)}
    if(e.target.closest('[data-lamp]')&&predict){g.seen.add(rowOf(g));return update(g)}
    const c=e.target.closest('td[data-out]');
    if(c&&predict){g.seen.add(+c.dataset.out);update(g)}
  });
  document.getElementById('gates').appendChild(el);
  update(g);
}
const rowOf=g=>g.vars.reduce((r,v)=>r*2+g.st[v],0);

function update(g){
  const el=g.el,row=rowOf(g),q=ev(g.tree,g.st);
  const hidden=predict&&!g.seen.has(row);
  el.querySelector('[data-expr]').innerHTML='Q = '+show(g.tree);
  g.vars.forEach(v=>{
    const on=!!g.st[v];
    const b=el.querySelector(`[data-in="${v}"]`);b.setAttribute('aria-pressed',on);b.textContent=`${v} = ${g.st[v]}`;
    el.querySelector(`[data-w="${v}"]`).classList.toggle('on',on);
    el.querySelector(`[data-t="${v}"]`).classList.toggle('on',on);
  });
  const qw=el.querySelector('[data-w="Q"]');qw.classList.toggle('on',!hidden&&!!q);qw.classList.toggle('unknown',hidden);
  const lamp=el.querySelector('[data-lamp]');
  lamp.textContent=hidden?'?':q;lamp.classList.toggle('on',!hidden&&!!q);lamp.classList.toggle('ask',hidden);
  lamp.setAttribute('aria-label',hidden?'Output hidden. Click to reveal.':`Output Q is ${q}`);
  el.querySelectorAll('tbody tr').forEach(tr=>{
    const r=+tr.dataset.r,out=ev(g.tree,envFor(r,g.vars)),hid=predict&&!g.seen.has(r);
    tr.classList.toggle('cur',r===row);
    const td=tr.lastElementChild;td.textContent=hid?'?':out;td.className=hid?'hid':(out?'one':'');
    td.title=hid?'Click to reveal':'';
  });
}

GATES.forEach(build);
bindNotation(()=>GATES.forEach(update));
document.getElementById('predict').addEventListener('change',e=>{predict=e.target.checked;GATES.forEach(g=>{g.seen.clear();update(g)})});
</script>
</body>
</html>
