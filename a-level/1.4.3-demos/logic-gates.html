<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic gates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
<style>
.tt td.hid{color:var(--muted);cursor:pointer;text-decoration:underline dotted}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;margin-top:26px}
.gate{background:var(--panel);border:1.5px solid var(--line);border-top:5px solid var(--ink);border-radius:6px 6px 14px 14px;padding:18px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 26px;align-items:start}
.gate h2{margin:0;font:700 1.9rem/1 var(--mono);letter-spacing:-.02em}
.gate .expr{font-size:1.15rem;margin:6px 0 2px}
.gate .desc{color:var(--muted);margin:0 0 4px}
.gate svg{width:100%;max-width:380px;display:block;margin:4px 0 6px}
.shape{fill:var(--panel);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.curve{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.w{stroke:var(--off);stroke-width:5;stroke-linecap:round;fill:none;transition:stroke .15s}
.w.on{stroke:var(--one)}
.w.unknown{stroke-dasharray:3 9}
.term{fill:var(--off);transition:fill .15s}.term.on{fill:var(--one)}
svg text{font:700 15px var(--mono);fill:var(--ink)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gives{color:var(--muted);font-size:.9rem;margin:0 2px}
.lamp{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 1.25rem var(--mono);background:var(--panel);color:var(--ink);transition:background .15s,box-shadow .15s;cursor:default}
.lamp.on{background:var(--one);border-color:var(--one);color:#fff;box-shadow:0 0 0 6px var(--one-soft),0 0 26px var(--one)}
.lamp.ask{border-style:dashed;cursor:pointer}
.ttcol{padding-top:4px}
.ttcol .cap{font-size:.85rem;color:var(--muted);margin:0 0 6px}
@media (max-width:600px){.gate{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="series" aria-label="1.4.3 demos"><a class="home" href="../../index.html">← Home</a><a href="logic-gates.html" aria-current="page">Logic gates</a><a href="boolean-simplification.html">Boolean simplification</a><a href="karnaugh-maps.html">Karnaugh maps</a><a href="d-type-flip-flop.html">D-type flip-flops</a><a href="half-full-adders.html">Half and full adders</a><a href="ripple-carry-adder.html">Ripple-carry adder</a></nav>
  <p class="spec">OCR A LEVEL · 1.4.3</p>
  <h1>Logic gates</h1>
  <p class="lede">Click an input to switch it between 0 and 1. A wire turns blue when it carries a 1, and the matching row of the truth table lights up.</p>
  <div class="toolbar">
    <span>Notation</span>
    <div class="seg" role="radiogroup" aria-label="Notation" id="nota">
      <button role="radio" data-n="ocr">¬ ∧ ∨ ⊻</button>
      <button role="radio" data-n="words">NOT AND OR XOR</button>
      <button role="radio" data-n="alg">Algebra</button>
    </div>
    <label class="check"><input type="checkbox" id="predict"> Hide outputs so the class can predict</label>
  </div>
  <main class="gates" id="gates"></main>
</div>
<script src="../../assets/site.js"></script>
<script src="../../assets/logic.js"></script>
<script>
/* ---------- gates ---------- */
const GATES=[
  {id:'and',name:'AND',vars:['A','B'],src:'A&B',desc:'Output is 1 only when both inputs are 1.'},
  {id:'or',name:'OR',vars:['A','B'],src:'A|B',desc:'Output is 1 when at least one input is 1.'},
  {id:'not',name:'NOT',vars:['A'],src:'!A',desc:'Output is the opposite of the input. It has only one input.'},
  {id:'xor',name:'XOR',vars:['A','B'],src:'A^B',desc:'Output is 1 when the two inputs are different.'}
];
const SHAPES={
  and:{inX:60,outX:125,d:'M60 20 H95 A30 30 0 0 1 95 80 H60 Z'},
  or:{inX:62.5,outX:130,d:'M55 20 Q75 50 55 80 Q100 80 130 50 Q100 20 55 20 Z'},
  xor:{inX:54.5,outX:138,d:'M63 20 Q83 50 63 80 Q108 80 138 50 Q108 20 63 20 Z',extra:'M47 20 Q67 50 47 80'},
  not:{inX:65,outX:132,d:'M65 20 L120 50 L65 80 Z',bubble:true}
};
let predict=false;

function svgFor(g){
  const s=SHAPES[g.id],ys=g.vars.length===2?[35,65]:[50];
  const ins=g.vars.map((v,k)=>`<text x="0" y="${ys[k]+5}">${v}</text><path class="w" data-w="${v}" d="M20 ${ys[k]} H${s.inX}"/><circle class="term" data-t="${v}" cx="20" cy="${ys[k]}" r="6"/>`).join('');
  return `<svg viewBox="0 0 222 100" role="img" aria-label="${g.name} gate symbol">${ins}
    <path class="w" data-w="Q" d="M${s.outX} 50 H198"/>
    <path class="shape" d="${s.d}"/>${s.extra?`<path class="curve" d="${s.extra}"/>`:''}${s.bubble?'<circle class="shape" cx="126" cy="50" r="6"/>':''}
    <text x="206" y="55">Q</text></svg>`;
}

function build(g){
  g.tree=parse(g.src);g.st={A:0,B:0};g.seen=new Set();
  const el=document.createElement('section');el.className='gate';el.id=g.id;g.el=el;
  const rows=[...Array(1<<g.vars.length).keys()];
  el.innerHTML=`<div>
      <h2>${g.name}</h2>
      <p class="expr" data-expr></p>
      <p class="desc">${g.desc}</p>
      ${svgFor(g)}
      <div class="controls">
        ${g.vars.map(v=>`<button class="bit" data-in="${v}" aria-pressed="false"></button>`).join('')}
        <span class="gives">gives</span>
        <button class="lamp" data-lamp aria-live="polite"></button>
      </div>
    </div>
    <div class="ttcol">
      <p class="cap">Truth table</p>
      <table class="tt"><thead><tr>${g.vars.map(v=>`<th>${v}</th>`).join('')}<th>Q</th></tr></thead>
      <tbody>${rows.map(r=>{const e=envFor(r,g.vars);return`<tr data-r="${r}">${g.vars.map(v=>`<td>${e[v]}</td>`).join('')}<td data-out="${r}"></td></tr>`}).join('')}</tbody></table>
    </div>`;
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-in]');
    if(b){g.st[b.dataset.in]^=1;return update(g)}
    if(e.target.closest('[data-lamp]')&&predict){g.seen.add(rowOf(g));return update(g)}
    const c=e.target.closest('td[data-out]');
    if(c&&predict){g.seen.add(+c.dataset.out);update(g)}
  });
  document.getElementById('gates').appendChild(el);
  update(g);
}
const rowOf=g=>g.vars.reduce((r,v)=>r*2+g.st[v],0);

function update(g){
  const el=g.el,row=rowOf(g),q=ev(g.tree,g.st);
  const hidden=predict&&!g.seen.has(row);
  el.querySelector('[data-expr]').innerHTML='Q = '+show(g.tree);
  g.vars.forEach(v=>{
    const on=!!g.st[v];
    const b=el.querySelector(`[data-in="${v}"]`);b.setAttribute('aria-pressed',on);b.textContent=`${v} = ${g.st[v]}`;
    el.querySelector(`[data-w="${v}"]`).classList.toggle('on',on);
    el.querySelector(`[data-t="${v}"]`).classList.toggle('on',on);
  });
  const qw=el.querySelector('[data-w="Q"]');qw.classList.toggle('on',!hidden&&!!q);qw.classList.toggle('unknown',hidden);
  const lamp=el.querySelector('[data-lamp]');
  lamp.textContent=hidden?'?':q;lamp.classList.toggle('on',!hidden&&!!q);lamp.classList.toggle('ask',hidden);
  lamp.setAttribute('aria-label',hidden?'Output hidden. Click to reveal.':`Output Q is ${q}`);
  el.querySelectorAll('tbody tr').forEach(tr=>{
    const r=+tr.dataset.r,out=ev(g.tree,envFor(r,g.vars)),hid=predict&&!g.seen.has(r);
    tr.classList.toggle('cur',r===row);
    const td=tr.lastElementChild;td.textContent=hid?'?':out;td.className=hid?'hid':(out?'one':'');
    td.title=hid?'Click to reveal':'';
  });
}

GATES.forEach(build);
bindNotation(()=>GATES.forEach(update));
document.getElementById('predict').addEventListener('change',e=>{predict=e.target.checked;GATES.forEach(g=>{g.seen.clear();update(g)})});
</script>
</body>
</html>
