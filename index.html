<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTB's Resources</title>
<meta name="description" content="Interactive Computer Science demos for GCSE and A-Level students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121820;
    --panel-hi: #18212c;
    --line: #243040;
    --text: #e6edf3;
    --muted: #8b98a8;
    --alevel: #4ade80;
    --gcse: #38bdf8;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Space Grotesk", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 1px 1px, #1c2632 1px, transparent 0);
    background-size: 24px 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }

  /* Header */
  header { padding: 64px 0 32px; }
  .prompt {
    font-family: var(--mono);
    color: var(--alevel);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .prompt .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: var(--alevel); vertical-align: -3px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1 {
    font-size: clamp(36px, 7vw, 64px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  h1 .bits { font-family: var(--mono); color: var(--muted); font-size: 0.4em; font-weight: 400; display: block; margin-top: 12px; letter-spacing: 0; }
  .sub { color: var(--muted); margin-top: 16px; max-width: 520px; line-height: 1.5; }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 16px 0;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  .search {
    flex: 1 1 260px;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 12px;
  }
  .search:focus-within { border-color: var(--muted); }
  .search input {
    flex: 1; background: none; border: 0; outline: 0;
    color: var(--text); font: 15px var(--mono); padding: 12px 0;
  }
  .search kbd {
    font: 12px var(--mono); color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
  }
  .filters { display: flex; gap: 6px; }
  .filters button {
    font: 600 13px var(--mono);
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 14px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }
  .filters button[data-f="alevel"][aria-pressed="true"] { background: var(--alevel); border-color: var(--alevel); }
  .filters button[data-f="gcse"][aria-pressed="true"] { background: var(--gcse); border-color: var(--gcse); }

  /* Sections */
  .course { margin-top: 40px; }
  .course-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .course-head h2 { font-size: 26px; letter-spacing: -0.02em; }
  .tag {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
    padding: 3px 8px; border-radius: 4px; color: var(--bg);
  }
  .course[data-c="alevel"] { --accent: var(--alevel); }
  .course[data-c="gcse"] { --accent: var(--gcse); }
  .course .tag { background: var(--accent); }

  .topic { margin-top: 20px; }
  .topic h3 {
    font: 600 13px var(--mono); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
  }
  .topic h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .card {
    position: relative; display: block;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 18px 16px;
    color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s, background .15s;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: .5; transition: opacity .15s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-2px); border-color: var(--accent);
    background: var(--panel-hi); outline: none;
  }
  .card:hover::before { opacity: 1; }
  .num { font: 12px var(--mono); color: var(--accent); }
  .card h4 { font-size: 18px; margin-top: 6px; font-weight: 600; }
  .arrow {
    position: absolute; right: 16px; top: 16px;
    font-family: var(--mono); color: var(--muted);
    transition: transform .15s, color .15s;
  }
  .card:hover .arrow { transform: translateX(3px); color: var(--accent); }

  .empty { color: var(--muted); font-family: var(--mono); margin-top: 40px; display: none; }
  footer { margin-top: 64px; color: var(--muted); font: 13px var(--mono); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="prompt">~/htb $ ls resources/<span class="cursor"></span></div>
    <h1>HTB's Resources<span class="bits">01001000 01010100 01000010</span></h1>
    <p class="sub">Interactive demos for GCSE and A-Level Computer Science. Pick a topic and have a play.</p>
  </header>

  <div class="controls">
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Search demos…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="filters" role="group" aria-label="Filter by course">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="alevel" aria-pressed="false">A-Level</button>
      <button data-f="gcse" aria-pressed="false">GCSE</button>
    </div>
  </div>

  <main id="main"></main>
  <p class="empty" id="empty">No demos match that search.</p>

  <footer>// built for students · <span id="count"></span> demos</footer>
</div>

<script>
// ── Add new demos here ─────────────────────────────────────
const COURSES = [
  {
    id: "alevel", name: "A-Level Computer Science", tag: "OCR",
    topics: [
      { title: "1.4.3 Boolean Algebra", links: [
        ["Logic Gates", "a-level/1.4.3-demos/logic-gates.html"],
        ["Boolean Simplification", "a-level/1.4.3-demos/boolean-simplification.html"],
        ["Karnaugh Maps", "a-level/1.4.3-demos/karnaugh-maps.html"],
        ["D-Type Flip Flops", "a-level/1.4.3-demos/d-type-flip-flop.html"],
        ["Half and Full Adders", "a-level/1.4.3-demos/half-full-adders.html"],
        ["Ripple-Carry Adder", "a-level/1.4.3-demos/ripple-carry-adder.html"],
      ]},
    ],
  },
  {
    id: "gcse", name: "GCSE Computer Science", tag: "Edexcel",
    topics: [
      { title: "Topic 3", links: [
        ["Fetch-Decode-Execute", "gcse/3/fde-cycle.html"],
        ["Secondary Storage", "gcse/3/secondary-storage.html"],
        ["Embedded Systems", "gcse/3/embedded-systems.html"],
        ["Operating Systems", "gcse/3/operating-systems.html"],
        ["Utility Software", "gcse/3/utility-software.html"],
        ["Languages & Translators", "gcse/3/languages-translators.html"],
      ]},
    ],
  },
];
// ────────────────────────────────────────────────────────────

const main = document.getElementById("main");
let total = 0;

main.innerHTML = COURSES.map(c => `
  <section class="course" data-c="${c.id}">
    <div class="course-head"><h2>${c.name}</h2><span class="tag">${c.tag}</span></div>
    ${c.topics.map(t => `
      <div class="topic">
        <h3>${t.title}</h3>
        <div class="grid">
          ${t.links.map(([name, href], i) => (total++, `
            <a class="card" href="${href}" data-search="${(name + " " + t.title).toLowerCase()}">
              <span class="num">${String(i + 1).padStart(2, "0")}</span>
              <h4>${name}</h4>
              <span class="arrow">→</span>
            </a>`)).join("")}
        </div>
      </div>`).join("")}
  </section>`).join("");

document.getElementById("count").textContent = total;

const q = document.getElementById("q");
const buttons = document.querySelectorAll(".filters button");
let filter = "all";

function apply() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".course").forEach(sec => {
    const courseOk = filter === "all" || sec.dataset.c === filter;
    let secShown = 0;
    sec.querySelectorAll(".topic").forEach(topic => {
      let topicShown = 0;
      topic.querySelectorAll(".card").forEach(card => {
        const ok = courseOk && card.dataset.search.includes(term);
        card.hidden = !ok;
        if (ok) topicShown++;
      });
      topic.hidden = !topicShown;
      secShown += topicShown;
    });
    sec.hidden = !secShown;
    shown += secShown;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

q.addEventListener("input", apply);
buttons.forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  buttons.forEach(x => x.setAttribute("aria-pressed", x === b));
  apply();
}));
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape") { q.value = ""; q.blur(); apply(); }
});
</script>
</body>
</html>
