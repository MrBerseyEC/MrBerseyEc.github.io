<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTB's Vibe Coded Demos</title>
<meta name="description" content="Interactive Computer Science demos for GCSE and A-Level students.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.controls{position:sticky;top:0;z-index:10;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:0 10px}
.search:focus-within{border-color:var(--ink)}
.search input[type=search]{flex:1;min-width:0;border:0;outline:0;background:none;padding:8px 0}
.search kbd{font:.75rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.block>h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.block>h2 .spec{margin:0}
.topic{margin-top:16px}
.topic h3{font:600 .78rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.topic h3::after{content:"";flex:1;height:1px;background:var(--line)}
a.card{display:flex;align-items:baseline;gap:10px;color:inherit;text-decoration:none;font-weight:700}
a.card:hover,a.card:focus-visible{border-color:var(--ink);background:var(--hl-soft)}
a.card .num{font:600 .78rem var(--mono);color:var(--muted)}
a.card .arrow{margin-left:auto;font-family:var(--mono);color:var(--muted);transition:transform .15s}
a.card:hover .arrow{transform:translateX(3px);color:var(--ink)}
footer{margin-top:28px;color:var(--muted);font:.78rem var(--mono)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>HTB's Vibe Coded Demos</h1>
<p class="lede">Interactive demos for GCSE and A-Level Computer Science. Pick a topic and have a play.</p>

<div class="controls">
  <label class="search">
    <span aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="Search demos…" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <div class="seg" id="filters" role="group" aria-label="Filter by course">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="alevel" aria-pressed="false">A-Level</button>
    <button data-f="gcse" aria-pressed="false">GCSE</button>
  </div>
</div>

<main id="main"></main>
<p class="sub hidden" id="empty">No demos match that search.</p>

<footer><span id="count"></span> demos</footer>
</div>

<script>
// ── Add new demos here ─────────────────────────────────────
const COURSES = [
  {
    id: "alevel", name: "A-Level Computer Science", tag: "OCR",
    topics: [
      { title: "1.4.3 Boolean Algebra", links: [
        ["Logic Gates", "a-level/1.4.3-demos/logic-gates.html"],
        ["Boolean Simplification", "a-level/1.4.3-demos/boolean-simplification.html"],
        ["Karnaugh Maps", "a-level/1.4.3-demos/karnaugh-maps.html"],
        ["D-Type Flip Flops", "a-level/1.4.3-demos/d-type-flip-flop.html"],
        ["Half and Full Adders", "a-level/1.4.3-demos/half-full-adders.html"],
        ["Ripple-Carry Adder", "a-level/1.4.3-demos/ripple-carry-adder.html"],
      ]},
    ],
  },
  {
    id: "gcse", name: "GCSE Computer Science", tag: "Edexcel",
    topics: [
      { title: "Topic 3 (Computers)", links: [
        ["Fetch-Decode-Execute", "gcse/3/fde-cycle.html"],
        ["Secondary Storage", "gcse/3/secondary-storage.html"],
        ["Embedded Systems", "gcse/3/embedded-systems.html"],
        ["Operating Systems", "gcse/3/operating-systems.html"],
        ["Utility Software", "gcse/3/utility-software.html"],
        ["Robust Software", "gcse/3/robust-software.html"],
        ["Languages & Translators", "gcse/3/languages-translators.html"],
      ]},
      { title: "Topic 6 (Python)", links: [
        ["Inputs & Outputs", "gcse/6/inputs-outputs.html"],
        ["Variables & Constants", "gcse/6/variables-constants.html"],
        ["Selection", "gcse/6/selection.html"],
        ["For Loops", "gcse/6/for-loops.html"],
        ["While Loops", "gcse/6/while-loops.html"],
        ["1D Lists", "gcse/6/lists.html"],
        ["Strings", "gcse/6/strings.html"],
      ]},
    ],
  },
];
// ────────────────────────────────────────────────────────────

const main = document.getElementById("main");
let total = 0;

main.innerHTML = COURSES.map(c => `
  <section class="block course" data-c="${c.id}">
    <h2>${c.name}<span class="spec">${c.tag.toUpperCase()}</span></h2>
    ${c.topics.map(t => `
      <div class="topic">
        <h3>${t.title}</h3>
        <div class="cards">
          ${t.links.map(([name, href], i) => (total++, `
            <a class="card" href="${href}" data-search="${(name + " " + t.title).toLowerCase()}">
              <span class="num">${String(i + 1).padStart(2, "0")}</span>
              <span>${name}</span>
              <span class="arrow">→</span>
            </a>`)).join("")}
        </div>
      </div>`).join("")}
  </section>`).join("");

document.getElementById("count").textContent = total;

const q = document.getElementById("q");
const buttons = document.querySelectorAll("#filters button");
let filter = "all";

function apply() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".course").forEach(sec => {
    const courseOk = filter === "all" || sec.dataset.c === filter;
    let secShown = 0;
    sec.querySelectorAll(".topic").forEach(topic => {
      let topicShown = 0;
      topic.querySelectorAll(".card").forEach(card => {
        const ok = courseOk && card.dataset.search.includes(term);
        card.hidden = !ok;
        if (ok) topicShown++;
      });
      topic.hidden = !topicShown;
      secShown += topicShown;
    });
    sec.hidden = !secShown;
    shown += secShown;
  });
  document.getElementById("empty").classList.toggle("hidden", shown > 0);
}

q.addEventListener("input", apply);
buttons.forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  buttons.forEach(x => x.setAttribute("aria-pressed", x === b));
  apply();
}));
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape") { q.value = ""; q.blur(); apply(); }
});
</script>
</body>
</html>
